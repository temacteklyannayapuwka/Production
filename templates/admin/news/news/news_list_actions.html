{% if editorial_can_add %}
  <section class="bg-white border border-base-200 flex flex-col gap-3 mb-5 p-4 rounded-default shadow-xs sm:flex-row sm:items-center sm:justify-between dark:bg-base-900 dark:border-base-800">
    <div>
      <h2 class="font-semibold text-base text-font-important-light dark:text-font-important-dark">Новая новость</h2>
      <p class="mt-1 text-sm text-font-subtle-light dark:text-font-subtle-dark">Начни с заголовка, раздела и главного фото. Статус и отметку «Главная» можно менять прямо в таблице; после изменения нажми «Сохранить» внизу справа.</p>
    </div>
    <a href="{{ editorial_add_url }}" class="bg-primary-600 flex font-medium gap-2 items-center justify-center px-4 py-2 rounded-default text-sm text-white transition-colors hover:bg-primary-700">
      <span class="material-symbols-outlined text-base">add</span>
      Добавить новость
    </a>
  </section>
{% endif %}
